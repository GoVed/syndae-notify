services:
  syndae-notify:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syndae-notify-connector
    restart: unless-stopped
    ports:
      - "8769:8769"
    environment:
      - HTTP_PORT=8769
      - HTTP_HOST=0.0.0.0
      - NTFY_URL=${NTFY_URL:-}
      - GOTIFY_URL=${GOTIFY_URL:-}
      - GOTIFY_TOKEN=${GOTIFY_TOKEN:-}
      - SYNDAE_API_URL=http://host.docker.internal:3000
      - SYNDAE_ACCESS_KEY=${SYNDAE_ACCESS_KEY:-syndae-local-dev-key}
      - LOG_LEVEL=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - syndae_default

networks:
  default:
  syndae_default:
    external: true
